<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRM connection</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>CRM connection</h1>
      <p class="hint">Configure the connection once, then use Add to CRM on any LinkedIn profile.</p>
      <form id="connection-form">
        <label>CRM API URL<input id="api-url" type="url" placeholder="https://crm.example.com" required></label>
        <label>API token<input id="token" type="password" placeholder="crm_pat_…" required></label>
        <button type="submit">Save connection</button>
      </form>
      <p id="status" role="status"></p>
    </main>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
